<main class="container page">
  <div class="page-head">
    <div>
      <h1 class="display">{{ 'bookmarks.title' | transloco }}</h1>
      <p>{{ 'bookmarks.intro' | transloco }}</p>
    </div>
    <span class="count">{{ 'bookmarks.saved' | transloco: { count: dramas().length } }}</span>
  </div>

  @if (dramas().length) {
    <div class="drama-grid">
      @for (d of dramas(); track d.id) {
        <app-drama-card [drama]="d" />
      }
    </div>
  } @else {
    <app-empty-state
      [title]="'bookmarks.emptyTitle' | transloco"
      [message]="'bookmarks.emptyMessage' | transloco"
    >
      <a class="btn btn-primary" routerLink="/browse">{{ 'bookmarks.browse' | transloco }}</a>
    </app-empty-state>
  }
</main>
