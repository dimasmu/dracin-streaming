<article
  class="drama-card poster-card group"
  [style.--card-tone]="drama().tone"
  [attr.tabindex]="preview.supportsHover() ? -1 : null"
>
  <div class="poster-card-media">
    <div class="drama-art poster-artwork">
      <span class="drama-monogram">{{ monogram() }}</span>
    </div>
    <span class="poster-card-gradient" aria-hidden="true"></span>

    <span class="poster-platform-pill">
      <span class="poster-platform-dot" [style.background]="platformTone()"></span>
      <span class="truncate">{{ drama().platformId }}</span>
    </span>

    <span class="poster-play-circle" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
    </span>

    <div class="poster-bottom-ticks" aria-hidden="true">
      <span class="tick-group">
        @if (hasIdSub()) {
          <span class="tick-pill tick-sub">SUB ID</span>
        }
        @if (hasEnSub()) {
          <span class="tick-pill tick-dub">SUB EN</span>
        }
        <span class="tick-pill tick-ep">{{ episode() }} Eps</span>
      </span>
    </div>

    <a
      class="card-hit"
      [routerLink]="['/watch', drama().slug, watchEpisode()]"
      [attr.aria-label]="drama().title"
    ></a>
  </div>

  <div class="poster-card-body">
    <h3 class="poster-card-title">
      <a [routerLink]="['/watch', drama().slug, watchEpisode()]">{{ drama().title }}</a>
    </h3>
    <div class="poster-card-meta">
      <span class="truncate">{{ genresLine() }}</span>
      <span class="font-mono-tech shrink-0">{{ durationLabel() }}</span>
    </div>
  </div>
</article>
