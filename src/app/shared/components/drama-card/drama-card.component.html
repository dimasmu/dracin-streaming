<article
  class="drama-card"
  [style.--card-tone]="drama().tone"
  [attr.tabindex]="preview.supportsHover() ? -1 : null"
  (pointerenter)="onPointerEnter()"
  (pointerleave)="preview.scheduleClose()"
  (focusin)="onFocusIn()"
  (focusout)="preview.scheduleClose()"
>
  <div class="card-thumb">
    <div class="drama-art">
      <span class="drama-monogram">{{ monogram() }}</span>
    </div>
    <span class="card-shade"></span>
    <span class="card-platform">{{ drama().platformId }}</span>
    <span class="card-locale">{{ videoLangs() }}</span>

    <span class="card-play-overlay" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
    </span>

    <a
      class="card-hit"
      [routerLink]="['/watch', drama().slug, watchEpisode()]"
      [attr.aria-label]="drama().title"
    ></a>
  </div>

  <div class="card-copy">
    <h3>{{ drama().title }}</h3>
    <p><i class="episode-dot"></i> {{ 'common.episodeShort' | transloco: { n: episode() } }} &middot; {{ genre() ? ('genre.' + genre() | transloco) : '' }}</p>
  </div>
</article>
